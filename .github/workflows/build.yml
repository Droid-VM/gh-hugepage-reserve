name: build
on:
  push:
    paths: ['*.c', 'parts/**', 'abi/**', 'docker_exec.sh', 'tests/**', 'package/**', 'build.sh', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      ver:
        description: "module version from package/module.prop"
        value: ${{ jobs.package.outputs.ver }}
permissions:
  contents: read

jobs:
  # Tier 0 — pool logic in userspace, no kernel (POOL_DESIGN.md §3.3).
  mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tier-0a deterministic state-machine harness (ASan+UBSan) and
      # Tier-0b TSan race harness (§2 concurrency contract). gcc's TSan needs
      # ASLR reduced, hence setarch -R.
      - run: make -C tests harness && ./tests/harness
      - run: make -C tests race && setarch "$(uname -m)" -R ./tests/race

  # GKI compile matrix — the real version-gate test. The kapi backend flattens
  # per-version API divergence (folio_isolate_lru int-vs-bool, reclaim_pages
  # arity, try_to_free_mem_cgroup_pages args, alloc_contig_range arg3); each tag
  # exercises a DIFFERENT gate, so all three must compile. android14-6.1 /
  # android15-6.6 / android16-6.12 = the three target devices.
  # mode:real tags MUST compile the real module (the version-gate test — CI fails
  # if any breaks). mode:placeholder tags (older KMIs the real module cannot build
  # on) compile placeholder.c instead, so the shipped Magisk zip still carries a
  # loadable (functionless) gh_hugepage_reserve.ko for those kernels.
  gki:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: android14-6.1,  mode: real }
          - { tag: android15-6.6,  mode: real }
          - { tag: android16-6.12, mode: real }
          - { tag: android12-5.10, mode: placeholder }
          - { tag: android13-5.10, mode: placeholder }
          - { tag: android13-5.15, mode: placeholder }
          - { tag: android14-5.15, mode: placeholder }
    steps:
      - uses: actions/checkout@v4
      - name: build ${{ matrix.mode }} .ko for ${{ matrix.tag }}
        run: |
          set -e
          OUT="$PWD/package/ko/gh_hugepage_reserve"; mkdir -p "$OUT"
          if [ "${{ matrix.mode }}" = real ]; then SRC=gh_hugepage_reserve.c; else SRC=placeholder.c; fi
          docker run --rm -v "$PWD:/src:ro" -v "$OUT:/out_gh_hugepage_reserve" \
            "ghcr.io/ylarod/ddk-min:${{ matrix.tag }}" \
            sh /src/docker_exec.sh "$SRC:gh_hugepage_reserve"
          test -f "$OUT/${{ matrix.tag }}.ko"   # real: fails CI on regression; placeholder: always builds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ko-${{ matrix.tag }}
          path: package/ko/gh_hugepage_reserve/${{ matrix.tag }}.ko
          if-no-files-found: ignore

  # Assemble the flashable Magisk/KernelSU zip: the per-tag .ko from `gki`, the
  # package/ scripts (load.sh + boot hooks), and a freshly-built kapi_check
  # (load.sh's BTF ABI/MIGRATE_CMA preflight). Exposes `ver` (module.prop) so
  # release.yml can name the GitHub release. Skipped on pull_request.
  package:
    name: Package zip
    needs: gki
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.pkg.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ko-*
          merge-multiple: false
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      # kapi_check is NOT committed: build it fresh (static aarch64) so it always
      # matches THIS commit's abi/kapi_abi.tsv. Best-effort — the module still
      # loads without it (load.sh fail-opens, CMA reservoir stays off).
      - name: Build kapi_check (aarch64 static)
        run: |
          set -e
          docker run --rm --platform linux/arm64 -v "$PWD:/src" debian:bookworm \
            bash -c 'apt-get update -qq >/dev/null && \
              apt-get install -y -qq gcc libbpf-dev libelf-dev zlib1g-dev libzstd-dev >/dev/null && \
              gcc -O2 -Wall -I/src/abi /src/abi/kapi_check.c \
                  -lbpf -lelf -lz -lzstd -static -o /src/package/kapi_check'
          ls -l package/kapi_check
      - name: Assemble package + zip
        id: pkg
        run: |
          set -e
          OUT="package/ko/gh_hugepage_reserve"; mkdir -p "$OUT"
          find artifacts -name '*.ko' -exec cp -v {} "$OUT"/ \;
          count=$(find "$OUT" -name '*.ko' | wc -l)
          echo "built $count .ko"; ls -lh "$OUT" || true
          [ "$count" -gt 0 ] || { echo "::error::no .ko built for any tag"; exit 1; }
          ver=$(grep -E '^version=' package/module.prop | cut -d= -f2)
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          ( cd package && zip -r "../gh-hugepage-reserve-$ver.zip" . )
          ls -lh "gh-hugepage-reserve-$ver.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gh-hugepage-reserve-${{ steps.pkg.outputs.ver }}.zip
          path: gh-hugepage-reserve-${{ steps.pkg.outputs.ver }}.zip
          if-no-files-found: error

